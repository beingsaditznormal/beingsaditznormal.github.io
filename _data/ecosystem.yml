# Cultural ecosystem — the data behind /ecosystem.html
#
# To add something: copy an entry, paste it at the TOP of the list, edit, commit.
# GitHub Pages rebuilds the page on its own in about a minute.
#
#   - title: "Title"            # required
#     author: "Author / director / channel / newsletter"
#     type: book                # book | film | series | video | podcast | article | newsletter | paper | course
#     status: done              # done (consumed) | now (consuming) | next (will consume)
#     tags: [family, ww2]       # themes: they become the hubs that connect the graph.
#                               # reuse existing tags (lowercase, dash-separated) so things link up
#     when: "2026-11"           # optional, free text: "2026-11", "summer 2026", ...
#     paused: true              # optional, only for "now" items on hold
#     links:                    # optional, as many as you like
#       - label: goodreads
#         url: https://...
#     comment: "One or two lines of my own take."
#
# Always wrap text in "double quotes" (titles with apostrophes or colons break YAML otherwise).
# Within each status the page keeps the order of this file, so newest first.

